[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sea"
version = "0.1.0"
description = "Sample-efficient adaptation of 12-lead ECG classifiers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "wfdb>=4.1",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
